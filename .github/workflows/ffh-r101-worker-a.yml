name: FFH R101 worker A isolated cache benchmark
on:
  push:
    branches: [ffh-r101-isolated-benchmark-20261016]
    paths:
      - .github/workflows/ffh-r101-worker-a.yml
permissions:
  contents: read
jobs:
  isolated-benchmark-a:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ARGOS_DEVICE_TYPE: cpu
      OMP_NUM_THREADS: '1'
    steps:
      - name: Checkout test-only branch
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated Argos translator
        run: python -m pip install --disable-pip-version-check argostranslate==1.11.0
      - name: Benchmark unique and repeated invented sentences
        run: python tests/r101_benchmark.py --shard-index 0 --target es
      - name: Upload synthetic-only timing and QC report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ffh-r101-a-synthetic-report
          path: r101-output/
          if-no-files-found: warn
          retention-days: 3
