name: FFH R117 worker A 9-language offline guarded API load boundary
on:
  push:
    branches: [ffh-r117-stress-matrix-a-20261016]
    paths:
      - .github/workflows/ffh-r117-a-guarded-stress.yml
permissions:
  contents: read
jobs:
  guarded-load-a:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - target: es
            batch: 8
            beam: 4
          - target: fr
            batch: 8
            beam: 4
          - target: de
            batch: 8
            beam: 4
          - target: ja
            batch: 8
            beam: 4
          - target: ar
            batch: 8
            beam: 4
    steps:
      - name: Checkout experimental branch only
        uses: actions/checkout@v4
      - name: Python for integrity preflight
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax-check safe-load test and application code
        run: python -m py_compile app.py protected_translation.py tests/r117_guarded_load_boundary.py
      - name: Fetch pinned upstream source and prepare attributable test build
        run: |
          git clone --depth 1 --branch v1.11.0 https://github.com/argosopentech/argos-translate r109-upstream
          test "$(git -C r109-upstream rev-parse HEAD)" = "63b84ecb46c740c7a7c066d58636434d3e893ebf"
          python tools/r109_prepare_lightweight_source.py --upstream r109-upstream --output r109-light
      - name: Build a disposable image with exactly one target-language model
        run: |
          docker build --build-arg FFH_TEST_TARGET=${{ matrix.target }} \
            --build-arg FFH_TEST_BATCH=${{ matrix.batch }} \
            --build-arg FFH_TEST_BEAM=${{ matrix.beam }} \
            --tag ffh-r117-${{ matrix.target }} --file tests/r117.Dockerfile .
      - name: Stress two restarts, 25-item and parallel guarded batches, health and memory
        run: |
          mkdir -p r117-results-${{ matrix.target }}
          docker run --rm --network none --memory 512m --memory-swap 512m --cpus 1 \
            --pids-limit 128 \
            --volume "$PWD/r117-results-${{ matrix.target }}:/srv/ffh/r117-output" \
            ffh-r117-${{ matrix.target }}
      - name: Preserve provisional-only and resource evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r117-a-${{ matrix.target }}
          path: r117-results-${{ matrix.target }}/
          if-no-files-found: warn
          retention-days: 3
