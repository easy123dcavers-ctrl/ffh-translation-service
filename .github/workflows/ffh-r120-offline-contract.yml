name: FFH R120 offline authenticated cross-worker admission contracts
on:
  push:
    branches: [ffh-r120-cross-worker-admission-20261016]
    paths:
      - .github/workflows/ffh-r120-offline-contract.yml
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Flask without real model
        run: python -m pip install --disable-pip-version-check 'Flask>=3.1,<4'
      - name: Syntax-check cross-process lock and tests
        run: python -m py_compile app.py tests/test_r120_cross_worker.py
      - name: Exercise cross-process rejection and symlink protection
        run: python -m unittest discover -s tests -p test_r120_cross_worker.py -v
      - name: Verify auth privacy, bounded client retries and model hashes
        run: |
          python -m unittest discover -s tests -p test_r119_auth_privacy.py -v
          python -m unittest discover -s tests -p test_r119_retry_contract.py -v
          python -m unittest discover -s tests -p test_r119_model_tree.py -v
      - name: Verify previous R118, R116 and R108 behaviors
        run: |
          python -m unittest discover -s tests -p test_r118_admission.py -v
          python -m unittest discover -s tests -p test_r116_guarded_api.py -v
          python -m unittest discover -s tests -p test_r108_flask_http.py -v
