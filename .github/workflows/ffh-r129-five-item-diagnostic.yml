name: FFH R129 diagnostic five-item nine-model 0.1CPU
on:
  push:
    branches: [ffh-r129-disposable-endurance-20261017]
    paths: [.github/workflows/ffh-r129-five-item-diagnostic.yml]
permissions:
  contents: read
jobs:
  real-five-item-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 48
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pin source and prepare disposable diagnostic
        run: |
          set -euo pipefail
          test "$(git hash-object tests/r125f_bounded_switch.py)" = 'a73832312115cc02c019cb1fa2e8edd457c7654b'
          git clone --depth 1 --branch v1.11.0 https://github.com/argosopentech/argos-translate r109-upstream
          test "$(git -C r109-upstream rev-parse HEAD)" = '63b84ecb46c740c7a7c066d58636434d3e893ebf'
          python tools/r109_prepare_lightweight_source.py --upstream r109-upstream --output r109-light
          python -m r129.five_item_probe_patch tests/r125f_bounded_switch.py tests/r129_five_item_switch.py
          python - <<'PY'
          from pathlib import Path
          p=Path('tests/r125f.Dockerfile')
          data=p.read_text()
          a='COPY tests/r125f_bounded_switch.py tests/r125f_bounded_switch.py'
          b='CMD ["python", "tests/r125f_bounded_switch.py"]'
          assert data.count(a)==1 and data.count(b)==1
          Path('tests/r129_five_item.Dockerfile').write_text(
              data.replace(a,'COPY tests/r129_five_item_switch.py tests/r129_five_item_switch.py')
                  .replace(b,'CMD ["python", "tests/r129_five_item_switch.py"]'))
          PY
          python -m py_compile tests/r129_five_item_switch.py
      - name: Build nine verified actual Argos models
        run: |
          set -euo pipefail
          docker build -t ffh-r129-five-item --file tests/r129_five_item.Dockerfile .
      - name: Test five-item batches with strict memory and CPU cap
        timeout-minutes: 30
        run: |
          set -euo pipefail
          mkdir -p r129-five-item-output
          chmod 0777 r129-five-item-output # disposable synthetic CI evidence only
          TOKEN="$(python -c 'import secrets;print(secrets.token_urlsafe(48))')"
          trap 'unset TOKEN' EXIT
          docker run --rm --network none --memory 512m --memory-swap 512m \
            --cpus 0.1 --pids-limit 128 --cap-drop ALL \
            --security-opt no-new-privileges \
            -e "FFH_GUARDED_STAGING_TOKEN=$TOKEN" -e R125F_MAX_BATCHES=2 \
            -v "$PWD/r129-five-item-output:/srv/ffh/r125-output" \
            ffh-r129-five-item
      - name: Verify diagnostic only — no 30min certification
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('r129-five-item-output/summary.json').read_text())
          assert d['status']=='PASS_BOUNDED_NINE_MODEL_SWITCH_RESOURCE_ONLY', d['status']
          assert d['oom_kills']==0 and d['memory_peak_mib']<=409.6
          assert len(d['rounds'])==9
          assert all(1<=r['batches']<=2 and r['items']==5*r['batches'] for r in d['rounds'])
          assert d['items']==d['busy_429']*5
          print('PASS_5_ITEM_ONLY_NOT_1800S',d['memory_peak_mib'],d['headroom_pct'],d['wall_seconds'])
          PY
      - name: Keep failed and successful model measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ffh-r129-five-item-real-diagnostic
          path: r129-five-item-output/
          retention-days: 3
          if-no-files-found: warn
