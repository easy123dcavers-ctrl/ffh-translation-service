name: FFH R124 Spanish strict 20pct verified tree gateway
on:
  push:
    branches: [ffh-r124-eight-language-20pct-20261016]
    paths:
      - .github/workflows/ffh-r124-es-pinned-20pct.yml
permissions:
  contents: read
jobs:
  spanish-reverified-model:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Enforce new hard 20 pct memory rule and nine-target syntax
        run: |
          python -m py_compile tests/r123h_memory_policy.py tests/r124_eight_language_gateway.py
          python -m unittest discover -s tests -p test_r123h_20pct_headroom.py -v
      - name: Verify upstream exact Argos code source revision
        run: |
          git clone --depth 1 --branch v1.11.0 https://github.com/argosopentech/argos-translate r109-upstream
          test "$(git -C r109-upstream rev-parse HEAD)" = "63b84ecb46c740c7a7c066d58636434d3e893ebf"
          python tools/r109_prepare_lightweight_source.py --upstream r109-upstream --output r109-light
      - name: Reinstall Spanish Argos and verify same files as separately observed baseline
        run: |
          docker build --build-arg FFH_TEST_TARGET=es \
            --build-arg FFH_TEST_BATCH=1 --build-arg FFH_TEST_BEAM=4 \
            --tag ffh-r124-es-pinned --file tests/r124.Dockerfile .
      - name: Real 512 MiB Spanish gateway with four restarts and strict 20 pct threshold
        run: |
          mkdir -p r124-es
          TOKEN="$(python -c 'import secrets;print(secrets.token_urlsafe(48))')"
          docker run --rm --network none --memory 512m --memory-swap 512m --cpus 1 \
            --pids-limit 128 --env "FFH_GUARDED_STAGING_TOKEN=$TOKEN" \
            --volume "$PWD/r124-es:/srv/ffh/r118-output" \
            ffh-r124-es-pinned
          unset TOKEN
      - name: Preserve synthetic failure or success
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r124-es-reverified-model-headroom20
          path: r124-es/
          if-no-files-found: warn
          retention-days: 5
