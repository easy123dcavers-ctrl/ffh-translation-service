name: FFH R121b isolated German cold-start memory diagnostics
on:
  push:
    branches: [ffh-r121b-coldstart-memory-20261016]
    paths:
      - .github/workflows/ffh-r121b-cold-memory.yml
permissions:
  contents: read
jobs:
  cold-memory:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - profile: batch1-cold
            batch: 1
            warm: false
          - profile: batch8-warm
            batch: 8
            warm: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check test Python syntax
        run: python -m py_compile app.py tests/r121_real_migration_probe.py
      - name: Obtain exact Argos source and prepare tested lightweight fork
        run: |
          git clone --depth 1 --branch v1.11.0 https://github.com/argosopentech/argos-translate r109-upstream
          test "$(git -C r109-upstream rev-parse HEAD)" = "63b84ecb46c740c7a7c066d58636434d3e893ebf"
          python tools/r109_prepare_lightweight_source.py --upstream r109-upstream --output r109-light
      - name: Build single-model German offline image
        run: |
          docker build --build-arg FFH_TEST_TARGET=de \
            --build-arg FFH_TEST_BATCH=${{ matrix.batch }} \
            --build-arg FFH_TEST_BEAM=4 \
            --tag ffh-r121b-${{ matrix.profile }} --file tests/r121.Dockerfile .
      - name: Exercise guarded staging, health, memory and legacy bypass
        run: |
          mkdir -p r121b-${{ matrix.profile }}
          TEST_SECRET="$(python -c 'import secrets;print(secrets.token_urlsafe(48))')"
          docker run --rm --network none --memory 512m --memory-swap 512m --cpus 1 \
            --pids-limit 128 \
            --env "FFH_GUARDED_STAGING_TOKEN=$TEST_SECRET" \
            --env "R121_WARM_FIRST=${{ matrix.warm }}" \
            --volume "$PWD/r121b-${{ matrix.profile }}:/srv/ffh/r121-output" \
            ffh-r121b-${{ matrix.profile }}
          unset TEST_SECRET
      - name: Preserve failed and successful synthetic-only test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r121b-${{ matrix.profile }}
          path: r121b-${{ matrix.profile }}/
          if-no-files-found: warn
          retention-days: 3
