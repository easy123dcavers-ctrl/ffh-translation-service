name: FFH R146 hosted Supabase staging READ ONLY HTTPS and authorization perimeter
on:
  push:
    branches: [ffh-r146-hosted-stage-preflight-20261017]
    paths: [.github/workflows/ffh-r146-hosted-readonly.yml]
permissions:
  contents: read
concurrency:
  group: ffh-r146-readonly-hosted-supabase
  cancel-in-progress: false
jobs:
  real-hosted-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      FFH_R146_STAGE_URL: https://hlsjzjnondimwhqbgjqm.supabase.co
      FFH_R146_STAGE_PUBLISHABLE_KEY: sb_publishable_ZoYvYGbu9rJlPhHjM-3t3g_MqFWGkL2
      FFH_R146_READONLY_ONLY: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify immutable staging project and READ-ONLY requests
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = ffh-r146-hosted-stage-preflight-20261017
          python -m py_compile r146/hosted_preflight.py
      - name: Test 10 hosted HTTPS Supabase Auth and REST perimeter conditions
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest -v r146.hosted_preflight 2>&1 | tee r146-hosted-readonly.log
          grep -E 'Ran 10 tests' r146-hosted-readonly.log
          grep -E '^OK$' r146-hosted-readonly.log
          echo 'R146_HOSTED_STAGING_HTTPS_NEGATIVE_CHECKS_ONLY_NO_MEMBERS_NO_WRITES'
      - name: Preserve exact tested files and scrubbed status logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ffh-r146-hosted-staging-readonly-verified
          path: |
            r146-hosted-readonly.log
            r146/
          if-no-files-found: warn
          retention-days: 7
