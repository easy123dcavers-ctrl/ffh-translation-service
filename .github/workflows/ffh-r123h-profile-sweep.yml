name: FFH R123H 20 percent headroom model inference sweep
on:
  push:
    branches: [ffh-r123h-headroom20-20261016]
    paths:
      - .github/workflows/ffh-r123h-profile-sweep.yml
permissions:
  contents: read
jobs:
  hard-512m-profiles:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - profile: beam4-repeat
            beam: 4
          - profile: beam2
            beam: 2
          - profile: beam1
            beam: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check policy syntax and 20 percent resource floor
        run: |
          python -m py_compile app.py tests/r123_gateway_real_soak.py tests/r123h_memory_policy.py
          python -m unittest discover -s tests -p test_r123h_20pct_headroom.py -v
      - name: Build test-only attributed lightweight Argos
        run: |
          git clone --depth 1 --branch v1.11.0 https://github.com/argosopentech/argos-translate r109-upstream
          test "$(git -C r109-upstream rev-parse HEAD)" = "63b84ecb46c740c7a7c066d58636434d3e893ebf"
          python tools/r109_prepare_lightweight_source.py --upstream r109-upstream --output r109-light
      - name: Build one model with different inference beam; no safety approval
        run: |
          docker build --build-arg FFH_TEST_TARGET=de \
            --build-arg FFH_TEST_BATCH=1 \
            --build-arg FFH_TEST_BEAM=${{ matrix.beam }} \
            --tag ffh-r123h-${{ matrix.profile }} --file tests/r123.Dockerfile .
      - name: Hard 512MiB zero-OOM and 20 percent resource stop condition
        run: |
          mkdir -p r123h-${{ matrix.profile }}
          TEST_TOKEN="$(python -c 'import secrets;print(secrets.token_urlsafe(48))')"
          docker run --rm --network none --memory 512m --memory-swap 512m --cpus 1 \
            --pids-limit 128 --env "FFH_GUARDED_STAGING_TOKEN=$TEST_TOKEN" \
            --volume "$PWD/r123h-${{ matrix.profile }}:/srv/ffh/r118-output" \
            ffh-r123h-${{ matrix.profile }}
          unset TEST_TOKEN
      - name: Archive unapproved evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r123h-20pct-${{ matrix.profile }}
          path: r123h-${{ matrix.profile }}/
          if-no-files-found: warn
          retention-days: 3
