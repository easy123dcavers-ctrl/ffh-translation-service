name: FFH R98 isolated real-model proof (synthetic only)
on:
  push:
    branches:
      - ffh-r98-real-model-pilot-20261016
    paths:
      - .github/workflows/ffh-r98-real-model-pilot.yml
permissions:
  contents: read
jobs:
  synthetic-model-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      ARGOS_DEVICE_TYPE: cpu
      OMP_NUM_THREADS: "1"
    steps:
      - name: Checkout public test branch
        uses: actions/checkout@v4
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install free Argos runtime
        run: python -m pip install --disable-pip-version-check argostranslate==1.11.0
      - name: Test a real English-to-Spanish model with invented text only
        run: |
          python - <<'PY'
          import json, re, time
          import argostranslate.package as package
          import argostranslate.translate as translate
          package.update_package_index()
          pairs = package.get_available_packages()
          match = next((p for p in pairs if p.from_code == 'en' and p.to_code == 'es'), None)
          if match is None:
              raise RuntimeError('No direct English-Spanish model listed')
          print('MODEL_META', json.dumps({'source':'en','target':'es','version':match.package_version},sort_keys=True))
          package.install_from_path(match.download())
          cases = [
              'Add 50 g of salt to 1 L of water.',
              'The vegetables are in the jar.',
              'Close the lid gently and label the container.',
              'Stir the mixture once a day.',
              'This recipe uses 5% salt by weight.'
          ]
          accepted = 0
          held = 0
          started = time.perf_counter()
          for i, source in enumerate(cases, 1):
              t0 = time.perf_counter()
              target = translate.translate(source, 'en', 'es')
              nums = re.findall(r'(?<![A-Za-z])\d+(?:[.,]\d+)?', source)
              outnums = re.findall(r'(?<![A-Za-z])\d+(?:[.,]\d+)?', target)
              flags = []
              if not target.strip() or target.strip()==source.strip():
                  flags.append('empty_or_identical')
              if sorted(v.replace(',','.') for v in nums) != sorted(v.replace(',','.') for v in outnums):
                  flags.append('number_changed')
              if flags: held += 1
              else: accepted += 1
              print('SYNTHETIC_CASE', json.dumps({'id':i,'source':source,'draft':target,'status':'held' if flags else 'provisional_candidate','flags':flags,'seconds':round(time.perf_counter()-t0,2)},ensure_ascii=False))
          print('REAL_MODEL_PILOT_SUMMARY', json.dumps({'model':'en-es','tested':len(cases),'provisional_candidates':accepted,'held':held,'total_seconds':round(time.perf_counter()-started,2),'production_writes':0,'supabase_access':False,'automatic_approvals':0},sort_keys=True))
          assert accepted+held == len(cases)
          assert accepted >= 1, 'All drafts failed mechanical QA'
          PY
