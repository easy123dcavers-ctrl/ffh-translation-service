name: FFH R140 disposable PostgreSQL 16 ledger and role security
on:
  push:
    branches: [ffh-r140-ephemeral-postgres-20261017]
    paths: [.github/workflows/ffh-r140-ephemeral-postgres.yml]
permissions:
  contents: read
concurrency:
  group: ffh-r140-pg-real-ephemeral
  cancel-in-progress: false
jobs:
  ephemeral-real-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ffh_r140_ephemeral
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: r140_pg_ci_fake_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ffh_r140_ephemeral"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      FFH_R140_EPHEMERAL_ONLY: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check isolated run boundary and required module syntax
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'ffh-r140-ephemeral-postgres-20261017'
          test "$FFH_R140_EPHEMERAL_ONLY" = 1
          python -m py_compile r140/pg_real.py r140/pg_ephemeral_tests.py
      - name: Install independently pinned PostgreSQL Python driver
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'psycopg[binary]==3.2.6'
          python - <<'PY'
          import psycopg
          print('R140_DRIVER',psycopg.__version__)
          assert psycopg.__version__=='3.2.6'
          PY
      # R140 v3: adds lost COMMIT acknowledgment + quota-denied retry.\n      # R140 v2: PostgreSQL UPDATE WHERE state requires narrow SELECT(state).
      - name: Real PostgreSQL transactions, row security and process restart
        shell: bash
        run: |
          set -euo pipefail
          python -m r140.pg_ephemeral_tests -v 2>&1 | tee r140-pg-test.log
          grep -E 'Ran 22 tests' r140-pg-test.log
          grep -E '^OK$' r140-pg-test.log
          echo 'R140_REAL_POSTGRES_PASS_NOT_LIVE_MEMBER_AUTH_OR_PRODUCTION'
      - name: Preserve test output on failure or success
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ffh-r140-ephemeral-real-postgres-evidence
          path: r140-pg-test.log
          retention-days: 5
          if-no-files-found: warn
