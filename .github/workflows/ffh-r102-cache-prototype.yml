name: FFH R102 isolated cache contract tests
on:
  push:
    branches: [ffh-r102-optin-cache-prototype-20261016]
    paths:
      - .github/workflows/ffh-r102-cache-prototype.yml
permissions:
  contents: read
jobs:
  offline-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout isolated test branch
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax-check prototype modules
        run: python -m py_compile app.py translation_cache.py tests/test_r102_cache.py
      - name: Test bounded cache with no external services
        run: python -m unittest discover -s tests -p 'test_r102_cache.py' -v
