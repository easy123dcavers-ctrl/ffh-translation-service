name: FFH R103 worker A isolated memory and segmentation profiles
on:
  push:
    branches: [ffh-r103-memory-profile-20261016]
    paths:
      - .github/workflows/ffh-r103-memory-a.yml
permissions:
  contents: read
jobs:
  r103-memory-a:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ARGOS_DEVICE_TYPE: cpu
      OMP_NUM_THREADS: '1'
    steps:
      - name: Checkout isolated R103 branch
        uses: actions/checkout@v4
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned Argos translator for benchmark
        run: python -m pip install --disable-pip-version-check argostranslate==1.11.0
      - name: Run separate-process baseline, MiniSBD and int8 memory profiles
        run: python tests/r103_memory_profiles.py parent --worker A
      - name: Upload only invented text and measured results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r103-memory-a-synthetic-report
          path: r103-output/
          if-no-files-found: warn
          retention-days: 3
