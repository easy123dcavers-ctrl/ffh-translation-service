name: FFH R125d second independent nine language switch
on:
  push:
    branches: [ffh-r125d-nine-switch-repeat-20261016]
    paths: [.github/workflows/ffh-r125d-nine-repeat.yml]
permissions:
  contents: read
jobs:
  serial-nine:
    runs-on: ubuntu-latest
    timeout-minutes: 42
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Preflight language switching and hard 20 percent headroom
        run: |
          python -m py_compile tests/r125c_nine_switch.py tests/r125_serial_gateway.py
          python -m unittest discover -s tests -p test_r125_router_contract.py -v
          python -m unittest discover -s tests -p test_r123h_20pct_headroom.py -v
      - name: Verify pinned Argos lightweight source against actual upstream commit
        run: |
          git clone --depth 1 --branch v1.11.0 https://github.com/argosopentech/argos-translate r109-upstream
          test "$(git -C r109-upstream rev-parse HEAD)" = "63b84ecb46c740c7a7c066d58636434d3e893ebf"
          python tools/r109_prepare_lightweight_source.py --upstream r109-upstream --output r109-light
      - name: Build nine observed target models on disk in one image, verify each model tree
        run: |
          docker build --tag ffh-r125d-nine-repeat --file tests/r125c.Dockerfile .
          docker image inspect ffh-r125d-nine-repeat --format 'R125C_IMAGE_BYTES {{.Size}}'
      - name: Test nine sequential targets under hard 512MiB and zero-runtime-network
        run: |
          mkdir -p r125d-results
          TOKEN="$(python -c 'import secrets;print(secrets.token_urlsafe(48))')"
          docker run --rm --network none --memory 512m --memory-swap 512m --cpus 1 \
            --pids-limit 128 --env "FFH_GUARDED_STAGING_TOKEN=$TOKEN" \
            --volume "$PWD/r125d-results:/srv/ffh/r125-output" \
            ffh-r125d-nine-repeat
          unset TOKEN
      - name: Archive raw synthetic model switch evidence including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r125d-nine-model-independent-repeat
          path: r125d-results/
          if-no-files-found: warn
          retention-days: 5
