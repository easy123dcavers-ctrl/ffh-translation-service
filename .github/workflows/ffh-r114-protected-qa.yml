name: FFH R114 protected source safeguards offline QA
on:
  push:
    branches: [ffh-r114-protected-source-qa-20261016]
    paths:
      - .github/workflows/ffh-r114-protected-qa.yml
      - protected_translation.py
      - tests/test_r114_protected_translation.py
permissions:
  contents: read
jobs:
  protected-token-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout test-only branch
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax-check guard and test
        run: python -m py_compile protected_translation.py tests/test_r114_protected_translation.py
      - name: Run fail-closed protected source QA
        run: python -m unittest discover -s tests -p test_r114_protected_translation.py -v
