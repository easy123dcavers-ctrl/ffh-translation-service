name: FFH R120 Korean cross-worker guarded 512MiB recovery
on:
  push:
    branches: [ffh-r120-cross-worker-admission-20261016]
    paths:
      - .github/workflows/ffh-r120-real-recycle.yml
permissions:
  contents: read
jobs:
  single-host-filelock:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        worker_max_requests: [12, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check source syntax
        run: python -m py_compile app.py tests/r119_authenticated_soak.py
      - name: Obtain pinned Argos upstream and build lightweight test source
        run: |
          git clone --depth 1 --branch v1.11.0 https://github.com/argosopentech/argos-translate r109-upstream
          test "$(git -C r109-upstream rev-parse HEAD)" = "63b84ecb46c740c7a7c066d58636434d3e893ebf"
          python tools/r109_prepare_lightweight_source.py --upstream r109-upstream --output r109-light
      - name: Install exactly one known-tree Korean model in disposable image
        run: |
          docker build --build-arg FFH_TEST_TARGET=ko \
            --build-arg FFH_TEST_BATCH=1 --build-arg FFH_TEST_BEAM=4 \
            --tag ffh-r120-ko-${{ matrix.worker_max_requests }} \
            --file tests/r119.Dockerfile .
      - name: Exercise worker recycling and cross-process fail-fast under hard 512MiB
        run: |
          mkdir -p r120-ko-${{ matrix.worker_max_requests }}
          TEST_TOKEN="$(python -c 'import secrets;print(secrets.token_urlsafe(48))')"
          docker run --rm --network none --memory 512m --memory-swap 512m --cpus 1 \
            --pids-limit 128 \
            --env "FFH_GUARDED_STAGING_TOKEN=$TEST_TOKEN" \
            --env "R119_TEST_MAX_REQUESTS=${{ matrix.worker_max_requests }}" \
            --volume "$PWD/r120-ko-${{ matrix.worker_max_requests }}:/srv/ffh/r118-output" \
            ffh-r120-ko-${{ matrix.worker_max_requests }}
          unset TEST_TOKEN
      - name: Preserve synthetic test evidence even on strict hold
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r120-ko-workerlimit-${{ matrix.worker_max_requests }}
          path: r120-ko-${{ matrix.worker_max_requests }}/
          if-no-files-found: warn
          retention-days: 3
