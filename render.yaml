services:
  - type: web
    name: ffh-translation-service
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python install_models.py
    startCommand: gunicorn --workers 1 --threads 1 --timeout 120 --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /health
    envVars:
      - key: ARGOS_DEVICE_TYPE
        value: cpu
      - key: PYTHONUNBUFFERED
        value: "1"
